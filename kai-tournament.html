<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金钟仁KAI直拍24选淘汰赛</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f8f8f8;padding:20px;color:#222;}
        .container{max-width:700px;margin:0 auto;}
        h1{text-align:center;margin:20px 0;font-size:22px;}
        .info{text-align:center;margin-bottom:20px;color:#666;font-size:15px;}
        .card-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0;}
        .card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000015;cursor:pointer;transition:0.2s;}
        .card:hover{transform:scale(1.02);}
        .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
        .card p{padding:12px;text-align:center;font-size:14px;}
        .btn-area{text-align:center;margin:20px 0;}
        button{padding:12px 24px;border:none;border-radius:10px;background:#222;color:white;font-size:16px;cursor:pointer;margin:0 6px;}
        button:disabled{background:#aaa;cursor:not-allowed;}
        .result-card{background:white;border-radius:16px;padding:20px;text-align:center;box-shadow:0 2px 12px #00000015;margin-bottom:14px;}
        .result-card img{width:90%;max-width:400px;border-radius:12px;margin-bottom:10px;}
        .rank-text{font-size:18px;font-weight:bold;margin:6px 0;}
        hr{margin:24px 0;border:0;border-top:1px solid #ddd;}
    </style>
</head>
<body>
<div class="container">
    <h1>金钟仁KAI直拍24选淘汰赛</h1>
    <div class="info" id="statusText">准备开始比赛</div>
    <div class="card-wrap" id="cardContainer"></div>
    <div class="btn-area" id="btnBox"></div>
    <div id="finalResult"></div>
</div>
<script>
// ==========素材区：图片CDN链接，带?v=1 永久规避CDN缓存问题==========
const allList = [
    {id:1,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai1.jpg?v=1",title:"Obsession X-EXO ver."},
    {id:2,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai2.jpg?v=1",title:"Confession 五巡"},
    {id:3,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai3.png?v=1",title:"History 20251214"},
    {id:4,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai4.png?v=1",title:"24/7 五巡"},
    {id:5,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai5.png?v=1",title:"Tempo showcase"},
    {id:6,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai6.png?v=1",title:"Crazy"},
    {id:7,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai7.png?v=1",title:"Adult Swim"},
    {id:8,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai8.png?v=1",title:"Rover KBS"},
    {id:9,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai9.png?v=1",title:"Mmmh 人气歌谣"},
    {id:10,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai10.png?v=1",title:"Peaches 人气歌谣"},
    {id:11,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai11.png?v=1",title:"The Eve"},
    {id:12,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai12.png?v=1",title:"Love Shot"},
    {id:13,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai13.png?v=1",title:"Monster"},
    {id:14,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai14.png?v=1",title:"Baby don't cry"},
    {id:15,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai15.png?v=1",title:"Call me baby"},
    {id:16,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai16.png?v=1",title:"Jopping"},
    {id:17,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai17.png?v=1",title:"Vanilla"},
    {id:18,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai18.png?v=1",title:"Lotto"},
    {id:19,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai19.png?v=1",title:"Power"},
    {id:20,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai20.png?v=1",title:"MAMA"},
    {id:21,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai21.png?v=1",title:"Lucky one"},
    {id:22,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai22.png?v=1",title:"Spoiler"},
    {id:23,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai23.png?v=1",title:"Bomba"},
    {id:24,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai24.png?v=1",title:"Wait on me"}
];
// =========================================================================

//全局状态
let stage = 1;
let pool = [];
let winners = [];
let losers = [];
let currentMatch = [];
let selectedId = null;
let losersRound1 = []; //24进12的败者（复活赛素材）
let winnersRound2 = []; //12进6胜者
let losersRound5 = []; //6进3败者，用来打456排位
let top3List = []; //保存最终冠亚季军

//洗牌
function shuffle(arr){
    const newArr = [...arr];
    for(let i = newArr.length-1;i>0;i--){
        const r = Math.floor(Math.random()*(i+1));
        [newArr[i],newArr[r]] = [newArr[r],newArr[i]];
    }
    return newArr;
}

//开启下一组PK
function nextMatch(){
    selectedId = null;
    document.getElementById("btnBox").innerHTML = "";
    document.getElementById("cardContainer").innerHTML = "";
    document.getElementById("finalResult").innerHTML = "";

    if(pool.length === 0){
        finishStage();
        return;
    }
    currentMatch = [pool[0], pool[1]];
    renderCards();
    setStatusText();
}

function setStatusText(){
    let stageName = "";
    switch(stage){
        case 1: stageName="阶段1：24进12";break;
        case 2: stageName="阶段2：12进6";break;
        case 3: stageName="阶段3：复活赛（第一轮败者角逐6复活名额）";break;
        case 4: stageName="阶段4：12进6（6强+复活6人）";break;
        case 5: stageName="阶段5：6进3";break;
        case 6: stageName="阶段6：冠亚季军争夺战（3人循环PK）";break;
        case 7: stageName="阶段7：4、5、6名排位赛";break;
    }
    document.getElementById("statusText").innerText = `${stageName}｜剩余待PK：${pool.length}`;
}

function renderCards(){
    const wrap = document.getElementById("cardContainer");
    wrap.innerHTML = "";
    currentMatch.forEach(item=>{
        const div = document.createElement("div");
        div.className = "card";
        div.onclick = ()=>selectItem(item.id);
        div.innerHTML = `<img src="${item.img}" alt="${item.title}"><p>${item.title}</p>`;
        if(selectedId === item.id) div.style.border = "3px solid #222";
        wrap.appendChild(div);
    })
}

function selectItem(id){
    selectedId = id;
    renderCards();
    const btnBox = document.getElementById("btnBox");
    btnBox.innerHTML = `<button onclick="confirmPick()">选择这一支晋级</button>`;
}

function confirmPick(){
    const win = currentMatch.find(x=>x.id===selectedId);
    const lose = currentMatch.find(x=>x.id!==selectedId);
    winners.push(win);
    losers.push(lose);
    pool.splice(0,2);
    nextMatch();
}

// 阶段结束，切换下一阶段
function finishStage(){
    switch(stage){
        case 1:
            //阶段1：24进12结束，胜者12人，败者12人存入losersRound1
            losersRound1 = [...losers];
            pool = shuffle(winners);
            winners = []; losers = [];
            stage = 2;
            break;
        case 2:
            //阶段2：12进6，得到6强，存入winnersRound2
            winnersRound2 = [...winners];
            pool = shuffle(losersRound1);
            winners = []; losers = [];
            stage = 3;
            break;
        case 3:
            //阶段3复活赛结束，复活胜者6人
            const revive6 = [...winners];
            //合并：6强 +复活6人 =12人进入阶段4
            pool = shuffle([...winnersRound2, ...revive6]);
            winners = []; losers = [];
            stage = 4;
            break;
        case 4:
            //阶段4：12进6，选出6人
            pool = shuffle(winners);
            winners = []; losers = [];
            stage = 5;
            break;
        case 5:
            //阶段5：6进3，胜者3人冲冠，败者3人打排位
            losersRound5 = [...losers];
            pool = shuffle(winners);
            winners = []; losers = [];
            stage = 6;
            break;
        case 6:
            //阶段6 3人循环PK完成，得到冠亚季军
            top3List = [...winners];
            pool = shuffle(losersRound5);
            winners = []; losers = [];
            stage =7;
            nextMatch();
            return;
        case 7:
            //阶段7排位赛结束，4,5,6名
            const rank456 = [...winners];
            showFinalResult(top3List, rank456);
            return;
    }
    nextMatch();
}

//展示最终排名
function showFinalResult(top3, rank456){
    document.querySelector(".card-wrap").innerHTML = "";
    document.getElementById("btnBox").innerHTML = `<button onclick="saveAllRankImage()">保存全部排名图片</button>`;
    let html = `<div class="result-card" id="captureArea">`;
    html += `<h3>🏆 冠亚季军</h3>`
    const rankName3 = ["冠军🥇","亚军🥈","季军🥉"];
    top3.forEach((item,idx)=>{
        html += `<p class="rank-text">${rankName3[idx]}</p><img src="${item.img}" /><p>${item.title}</p>`;
    })
    html += `<hr>`
    html += `<h3>📌 第4~6名</h3>`
    const rankName6 = ["第四名","第五名","第六名"];
    rank456.forEach((item,idx)=>{
        html += `<p class="rank-text">${rankName6[idx]}</p><img src="${item.img}" /><p>${item.title}</p>`;
    })
    html += `</div>`;
    document.getElementById("finalResult").innerHTML = html;
    document.getElementById("statusText").innerText = "✅全部赛程结束！";
}

//导出图片
async function saveAllRankImage(){
    const dom = document.getElementById("captureArea");
    const canvas = await html2canvas(dom);
    const link = document.createElement("a");
    link.download = "KAI直拍淘汰赛_最终排名.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

window.onload = function(){
    pool = shuffle([...allList]);
    nextMatch();
}
</script>
</body>
</html>
