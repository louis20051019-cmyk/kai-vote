<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金钟仁KAI直拍24选1淘汰赛</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f8f8f8;padding:20px;color:#222;}
        .container{max-width:700px;margin:0 auto;}
        h1{text-align:center;margin:20px 0;font-size:22px;}
        .info{text-align:center;margin-bottom:20px;color:#666;font-size:15px;}
        .card-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0;}
        .card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000015;cursor:pointer;transition:0.2s;}
        .card:hover{transform:scale(1.02);}
        .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
        .card p{padding:12px;text-align:center;font-size:14px;}
        .btn-area{text-align:center;margin:20px 0;}
        button{padding:12px 24px;border:none;border-radius:10px;background:#222;color:white;font-size:16px;cursor:pointer;margin:0 6px;}
        button:disabled{background:#aaa;cursor:not-allowed;}
        .result-card{background:white;border-radius:16px;padding:20px;text-align:center;box-shadow:0 2px 12px #00000015;margin-bottom:14px;}
        .result-card img{width:90%;max-width:400px;border-radius:12px;margin-bottom:10px;}
        .rank-text{font-size:18px;font-weight:bold;margin:6px 0;}
    </style>
</head>
<body>
<div class="container">
    <h1>金钟仁KAI直拍24选淘汰赛</h1>
    <div class="info" id="statusText">准备开始比赛</div>
    <div class="card-wrap" id="cardContainer"></div>
    <div class="btn-area" id="btnBox"></div>
    <div id="finalResult"></div>
</div>
<script>
// ==========素材区：在这里修改舞台名字！图片文件名必须和文件夹内一致==========
const allList = [
    {id:1,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai1.jpg",title:"Obsession X-EXO ver."},
    {id:2,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai2.jpg",title:"Confession 五巡"},
    {id:3,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai3.png",title:"History 20251214"},
    {id:4,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai4.png",title:"24/7 五巡"},
    {id:5,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai5.png",title:"Tempo showcase"},
    {id:6,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai6.png",title:"Crazy"},
    {id:7,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai7.png",title:"Adult Swim"},
    {id:8,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai8.png",title:"Rover KBS"},
    {id:9,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai9.png",title:"Mmmh 人气歌谣"},
    {id:10,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai10.png",title:"Peaches 人气歌谣"},
    {id:11,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai11.png",title:"The Eve"},
    {id:12,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai12.png",title:"Love Shot"},
    {id:13,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai13.png",title:"Monster"},
    {id:14,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai14.png",title:"Baby don't cry"},
    {id:15,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai15.png",title:"Call me baby"},
    {id:16,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai16.png",title:"Jopping"},
    {id:17,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai17.png",title:"Vanilla"},
    {id:18,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai18.png",title:"Lotto"},
    {id:19,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai19.png",title:"Power"},
    {id:20,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai20.png",title:"MAMA"},
    {id:21,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai21.png",title:"Lucky one"},
    {id:22,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai22.png",title:"Spoiler"},
    {id:23,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai23.png",title:"Bomba"},
    {id:24,img:"https://cdn.jsdelivr.net/gh/louis20051019-cmyk/kai-vote@main/kai24.png",title:"Wait on me"}
];
// =========================================================================
let candidatePool = [...allList];
let topFive = [];
let stage = "ROUND24"; // ROUND24:24进5 | FINAL_ROUND:前五继续PK争冠军
let currentMatch = [];
let selectedId = null;

//随机洗牌
function shuffle(arr){
    const newArr = [...arr];
    for(let i = newArr.length-1;i>0;i--){
        const r = Math.floor(Math.random()*(i+1));
        [newArr[i],newArr[r]] = [newArr[r],newArr[i]];
    }
    return newArr;
}

function nextRound(){
    selectedId = null;
    document.getElementById("btnBox").innerHTML = "";
    document.getElementById("cardContainer").innerHTML = "";

    //阶段1：24进5
    if(stage === "ROUND24"){
        if(candidatePool.length <=5){
            topFive = [...candidatePool];
            stage = "FINAL_ROUND";
            candidatePool = [...topFive];
            alert("✅已选出TOP5！接下来TOP5继续PK，角逐最终冠军！");
        }
    }

    //只剩1人，决出冠军
    if(candidatePool.length === 1){
        showChampion(candidatePool[0], topFive);
        return;
    }

    //每次2选1PK
    candidatePool = shuffle(candidatePool);
    currentMatch = [candidatePool[0], candidatePool[1]];
    renderCards();
    setStatus();
}

function setStatus(){
    let text = "";
    if(stage === "ROUND24"){
        text = `【24进5阶段】剩余待选：${candidatePool.length}，选出TOP5后再争冠军`;
    }else{
        text = `【TOP5冠军争夺战】剩余${candidatePool.length}支直拍，角逐最终冠军`;
    }
    document.getElementById("statusText").innerText = text;
}

function renderCards(){
    const wrap = document.getElementById("cardContainer");
    wrap.innerHTML = "";
    currentMatch.forEach(item=>{
        const div = document.createElement("div");
        div.className = "card";
        div.onclick = ()=>selectItem(item.id);
        div.innerHTML = `<img src="${item.img}" alt="${item.title}"><p>${item.title}</p>`;
        if(selectedId === item.id) div.style.border = "3px solid #222";
        wrap.appendChild(div);
    })
}

function selectItem(id){
    selectedId = id;
    renderCards();
    const btnBox = document.getElementById("btnBox");
    btnBox.innerHTML = `<button onclick="confirmPick()">选择这一支晋级</button>`;
}

function confirmPick(){
    const winItem = currentMatch.find(x=>x.id===selectedId);
    //淘汰落败选手，胜者留在池内继续比赛
    const loseItem = currentMatch.find(m=>m.id!==selectedId);
    candidatePool = candidatePool.filter(x=>x.id !== loseItem.id);
    nextRound();
}

//展示结果：同时列出TOP5排名+最终冠军
function showChampion(champ, fiveList){
    document.querySelector(".card-wrap").innerHTML = "";
    document.querySelector(".info").innerText = "🏆全部PK结束！决出最终冠军！";
    document.getElementById("btnBox").innerHTML = `<button onclick="saveAllResultImage()">保存最终结果卡片</button>`;
    const rankNames = ["冠军🥇","亚军🥈","季军🥉","第四名","第五名"];
    let html = `<div class="result-card" id="captureArea">`;
    fiveList.forEach((item,idx)=>{
        html += `
        <div>
            <p class="rank-text">${rankNames[idx]}</p>
            <img src="${item.img}" />
            <p>${item.title}</p>
        </div>
        `
    })
    html += `<p style="margin-top:16px;font-size:20px;font-weight:bold;">👑最终冠军：${champ.title}</p>`;
    html += `</div>`;
    document.getElementById("finalResult").innerHTML = html;
}

//图片导出功能
async function saveAllResultImage(){
    const dom = document.getElementById("captureArea");
    const canvas = await html2canvas(dom);
    const link = document.createElement("a");
    link.download = "KAI直拍TOP5+冠军结果.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

//页面自动启动
window.onload = function(){
    nextRound();
}
</script>
</body>
</html>
